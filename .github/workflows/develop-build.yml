name: Develop Build

on:
  push:
    branches:
      - develop # Trigger on pushes to the develop branch
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest # Specify the operating system for the runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Action to check out your repository code

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0' # Specify the Node.js version

      - name: Install Dependencies
        run: npm install 

      - name: Build Angular (production) and set base-href to repo name
        # adjust the output folder name below if your angular.json uses a different outputPath
        run: |
          REPO_NAME="ucaweb"
          echo "Building with base-href=/$REPO_NAME/"
          npm run build -- --configuration production --base-href="/${REPO_NAME}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/ucaweb/browser

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
